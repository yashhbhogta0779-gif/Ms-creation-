<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Your Name | Motion Graphics Designer and Video Editor</title>
<meta name="description" content="Portfolio of a motion graphics designer and video editor. YouTube editing, explainer videos, reels and logo animation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0F1C;
    --surface: #161A2E;
    --surface-2: #1D2240;
    --text: #EDEEF5;
    --muted: #9AA0BC;
    --line: #262B45;
    --violet: #7B5CFF;
    --yellow: #FFD84D;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Figtree", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .wrap { width: min(1160px, 92%); margin: 0 auto; }
  h1, h2, h3 { font-family: var(--display); letter-spacing: -.02em; line-height: 1.08; }
  h2 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 800; }
  .lead { color: var(--muted); max-width: 52ch; font-size: 1.12rem; }

  .btn { display: inline-flex; align-items: center; padding: 14px 26px; border-radius: 8px; font: inherit; font-weight: 600; text-decoration: none; border: 1px solid transparent; cursor: pointer; transition: background .2s, border-color .2s, color .2s; }
  .btn-primary { background: var(--yellow); color: #17180F; }
  .btn-primary:hover { background: #fff; }
  .btn-ghost { border-color: var(--line); color: var(--text); background: transparent; }
  .btn-ghost:hover { border-color: var(--violet); color: #fff; }

  /* Navigation */
  header.nav { position: sticky; top: 0; z-index: 20; background: rgba(13,15,28,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 68px; gap: 16px; }
  .logo { font-family: var(--display); font-weight: 800; font-size: 1.2rem; text-decoration: none; }
  .nav ul { display: flex; gap: 28px; list-style: none; }
  .nav ul a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: .96rem; }
  .nav ul a:hover { color: #fff; }
  .nav .btn { padding: 9px 18px; font-size: .92rem; }

  /* Hero */
  .hero { padding: 84px 0 96px; }
  .hero .wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: 60px; align-items: center; }
  .role { color: var(--yellow); font-weight: 600; margin-bottom: 18px; }
  .hero h1 { font-size: clamp(2.6rem, 6vw, 4.8rem); font-weight: 800; }
  .hero .lead { margin-top: 24px; }
  .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .stats { display: flex; gap: 44px; margin-top: 52px; padding-top: 30px; border-top: 1px solid var(--line); }
  .stats b { display: block; font-family: var(--display); font-size: 2.2rem; font-weight: 800; line-height: 1; }
  .stats span { color: var(--muted); font-size: .92rem; }

  /* Showreel and editing timeline */
  .reel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .reel-screen { position: relative; aspect-ratio: 16/9; width: 100%; border: 0; padding: 0; cursor: pointer; display: block; background: linear-gradient(135deg, #3B2A9E, #0D0F1C 80%); }
  .reel-screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .reel-screen .label { position: absolute; left: 18px; bottom: 16px; color: #fff; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .play { position: absolute; inset: 0; margin: auto; width: 68px; height: 68px; border-radius: 50%; background: var(--yellow); transition: transform .2s; }
  .play::after { content: ""; position: absolute; left: 27px; top: 20px; border-left: 21px solid #17180F; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .reel-screen:hover .play { transform: scale(1.1); }
  .timeline { position: relative; padding: 14px 16px 16px; display: grid; gap: 7px; }
  .track { height: 14px; position: relative; background: rgba(255,255,255,.04); border-radius: 3px; }
  .clip { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .t1 .clip { background: var(--violet); } .t2 .clip { background: #5C7CFF; } .t3 .clip { background: var(--yellow); opacity: .9; }
  .playhead { position: absolute; top: 8px; bottom: 8px; left: 16px; width: 2px; background: #fff; animation: run 7s linear infinite; }
  @keyframes run { from { left: 16px; } to { left: calc(100% - 18px); } }

  section { padding: 96px 0; border-top: 1px solid var(--line); }
  .head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 48px; }
  .head p { color: var(--muted); max-width: 46ch; }

  /* Services */
  .services { list-style: none; border-top: 1px solid var(--line); }
  .services li { display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; padding: 28px 0; border-bottom: 1px solid var(--line); }
  .services h3 { font-size: 1.5rem; font-weight: 500; }
  .services p { color: var(--muted); max-width: 56ch; }

  /* Work */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { padding: 8px 18px; border-radius: 40px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; font-weight: 500; font-size: .94rem; cursor: pointer; }
  .filters button:hover { color: #fff; border-color: var(--violet); }
  .filters button[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px 28px; }
  .card { all: unset; cursor: pointer; display: block; }
  .card:focus-visible { outline: 3px solid var(--yellow); outline-offset: 4px; border-radius: 12px; }
  .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #3B2A9E, #161A2E); border: 1px solid var(--line); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
  .card:hover .thumb img { transform: scale(1.04); }
  .thumb .play { width: 54px; height: 54px; opacity: 0; transition: opacity .2s, transform .2s; }
  .thumb .play::after { left: 21px; top: 15px; border-left-width: 16px; border-top-width: 11px; border-bottom-width: 11px; }
  .card:hover .play, .card:focus-visible .play { opacity: 1; }
  .card h3 { font-size: 1.2rem; font-weight: 500; margin-top: 14px; }
  .card p { color: var(--muted); font-size: .95rem; }
  .empty { color: var(--muted); padding: 30px 0; }

  /* Video modal */
  dialog { width: min(980px, 94vw); border: 0; border-radius: 14px; padding: 0; background: #000; color: #fff; margin: auto; }
  dialog::backdrop { background: rgba(5,6,12,.85); }
  .frame { aspect-ratio: 16/9; }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 1.4rem; cursor: pointer; }
  .close:hover { background: var(--violet); }

  /* Process */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; border-top: 3px solid var(--violet); padding-top: 22px; }
  .steps li::before { content: "Step " counter(s); font-weight: 600; font-size: .95rem; color: var(--yellow); }
  .steps h3 { font-size: 1.4rem; font-weight: 500; margin: 6px 0 8px; }
  .steps p { color: var(--muted); }

  /* About */
  .about { display: grid; grid-template-columns: 1fr 1.5fr; gap: 60px; align-items: start; }
  .photo { aspect-ratio: 4/5; border-radius: 14px; background: var(--surface-2) center/cover no-repeat; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 6rem; color: var(--yellow); border: 1px solid var(--line); }
  .about p { color: var(--muted); margin-top: 18px; max-width: 58ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; list-style: none; }
  .tools li { padding: 7px 16px; border-radius: 40px; background: var(--surface); border: 1px solid var(--line); font-size: .92rem; font-weight: 500; }

  /* Testimonials */
  .quotes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
  blockquote { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
  blockquote p { font-size: 1.12rem; }
  blockquote footer { margin-top: 20px; color: var(--muted); font-size: .94rem; }
  blockquote footer b { color: var(--text); font-weight: 600; }

  /* Contact */
  .contact { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; }
  .contact .lead { margin-top: 18px; }
  .avail { display: inline-flex; align-items: center; gap: 10px; margin: 22px 0 8px; font-weight: 600; }
  .avail::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #3DDC84; }
  .links { list-style: none; margin-top: 10px; }
  .links li { padding: 15px 0; border-bottom: 1px solid var(--line); }
  .links small { display: block; color: var(--muted); font-size: .86rem; }
  .links a { font-weight: 600; text-decoration: none; }
  .links a:hover { color: var(--yellow); }
  form { display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
  label { font-weight: 600; font-size: .94rem; display: block; margin-bottom: 6px; }
  input, textarea, select { width: 100%; padding: 13px 14px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  textarea { min-height: 140px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--violet); outline: none; }
  form .btn { justify-self: start; }

  footer.site { padding: 36px 0 52px; border-top: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
  footer.site .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  @media (max-width: 900px) {
    .hero .wrap, .about, .contact { grid-template-columns: 1fr; gap: 40px; }
    .steps, .quotes { grid-template-columns: 1fr; }
    .services li { grid-template-columns: 1fr; gap: 8px; }
    .nav ul { display: none; }
    .photo { max-width: 280px; }
    .stats { gap: 28px; }
    section { padding: 64px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .playhead { animation: none; }
    html { scroll-behavior: auto; }
    .thumb img, .play { transition: none; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="#top">Your Name</a>
    <nav aria-label="Main"><ul>
      <li><a href="#services">Services</a></li>
      <li><a href="#work">Work</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul></nav>
    <a class="btn btn-primary" href="#contact">Start a project</a>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <div>
        <p class="role">Motion graphics designer and video editor</p>
        <h1>Motion design that gives your story momentum.</h1>
        <p class="lead">I create motion graphics and video edits for YouTube creators, brands and agencies. Clean craft, clear communication and on-time delivery.</p>
        <div class="actions">
          <a class="btn btn-primary" href="#work">View selected work</a>
          <a class="btn btn-ghost" href="#contact">Get in touch</a>
        </div>
        <div class="stats">
          <div><b>50+</b><span>Projects delivered</span></div>
          <div><b>3+ years</b><span>Professional experience</span></div>
          <div><b>20+</b><span>Clients served</span></div>
        </div>
      </div>

      <div class="reel">
        <button class="reel-screen" id="reelBtn" type="button" aria-label="Play showreel">
          <img id="reelImg" alt="" src="">
          <span class="play"></span>
          <span class="label">Showreel 2026</span>
        </button>
        <div class="timeline" aria-hidden="true">
          <div class="track t1"><span class="clip" style="left:2%;width:30%"></span><span class="clip" style="left:36%;width:22%"></span><span class="clip" style="left:62%;width:34%"></span></div>
          <div class="track t2"><span class="clip" style="left:10%;width:18%"></span><span class="clip" style="left:32%;width:40%"></span><span class="clip" style="left:76%;width:18%"></span></div>
          <div class="track t3"><span class="clip" style="left:0;width:14%"></span><span class="clip" style="left:18%;width:26%"></span><span class="clip" style="left:50%;width:12%"></span><span class="clip" style="left:68%;width:28%"></span></div>
          <span class="playhead"></span>
        </div>
      </div>
    </div>
  </div>

  <section id="services">
    <div class="wrap">
      <div class="head">
        <h2>Services</h2>
        <p>End-to-end motion and editing support, from concept to final delivery.</p>
      </div>
      <ul class="services">
        <li><h3>Motion graphics</h3><p>Animated titles, icons, infographics and explainer videos that make complex ideas clear and engaging.</p></li>
        <li><h3>YouTube video editing</h3><p>Story-driven editing with tight pacing, sound design, subtitles and color, built to hold audience attention.</p></li>
        <li><h3>Reels and Shorts</h3><p>Vertical, high-retention videos with dynamic captions, optimized for Instagram and YouTube Shorts.</p></li>
        <li><h3>Logo animation and intros</h3><p>Concise, polished brand intros and logo reveals that fit your visual identity.</p></li>
      </ul>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <div class="head">
        <h2>Selected work</h2>
        <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      </div>
      <div class="grid" id="videos"></div>
    </div>
  </section>

  <section id="process">
    <div class="wrap">
      <div class="head">
        <h2>How we work together</h2>
        <p>A simple, transparent process so you always know what happens next.</p>
      </div>
      <ol class="steps">
        <li><h3>Brief</h3><p>You share the goals, style references, length and deadline. I review your raw footage and assets, then confirm the plan.</p></li>
        <li><h3>Draft</h3><p>I deliver a first draft with motion, sound and color applied, so you can see the direction early.</p></li>
        <li><h3>Revisions and delivery</h3><p>I refine based on your feedback and deliver the final video in the formats you need.</p></li>
      </ol>
    </div>
  </section>

  <section id="about">
    <div class="wrap about">
      <div class="photo" id="photo" role="img" aria-label="Portrait">A</div>
      <div>
        <h2>About me</h2>
        <p>I am [Your Name], a motion graphics designer and video editor based in [City, Country]. Add a short summary here: how long you have been editing, the kinds of clients you have worked with, and the projects you enjoy most.</p>
        <p>My approach is simple: the work should look refined and communicate its message clearly. I focus on clean timing, thoughtful design and reliable delivery.</p>
        <ul class="tools">
          <li>After Effects</li>
          <li>Premiere Pro</li>
          <li>DaVinci Resolve</li>
          <li>Photoshop</li>
        </ul>
      </div>
    </div>
  </section>

  <section id="reviews">
    <div class="wrap">
      <div class="head"><h2>Client feedback</h2></div>
      <div class="quotes">
        <blockquote>
          <p>Add a client testimonial here. Short and specific works best, for example: "The video arrived ahead of schedule and the editing was exceptionally clean."</p>
          <footer><b>Client name</b>, Role or company</footer>
        </blockquote>
        <blockquote>
          <p>Add a second testimonial here. If you do not have any yet, you can remove this section.</p>
          <footer><b>Client name</b>, Role or company</footer>
        </blockquote>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap contact">
      <div>
        <h2>Let's work together</h2>
        <p class="lead">Tell me about your project and I will reply within one business day.</p>
        <p class="avail">Available for new projects</p>
        <ul class="links">
          <li><small>Email</small><a href="mailto:you@example.com">you@example.com</a></li>
          <li><small>WhatsApp</small><a href="https://wa.me/910000000000" target="_blank" rel="noopener">+91 00000 00000</a></li>
          <li><small>Instagram</small><a href="https://instagram.com/your_username" target="_blank" rel="noopener">@your_username</a></li>
          <li><small>YouTube</small><a href="https://youtube.com/@your_channel" target="_blank" rel="noopener">youtube.com/@your_channel</a></li>
        </ul>
      </div>
      <form id="contactForm">
        <div><label for="n">Your name</label><input id="n" required autocomplete="name"></div>
        <div>
          <label for="t">Project type</label>
          <select id="t">
            <option>Motion graphics</option>
            <option>YouTube video editing</option>
            <option>Reels or Shorts</option>
            <option>Logo animation or intro</option>
            <option>Other</option>
          </select>
        </div>
        <div><label for="m">Project details</label><textarea id="m" required placeholder="What would you like to create? Include your timeline and any references."></textarea></div>
        <button class="btn btn-primary" type="submit">Send enquiry</button>
      </form>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <span>&copy; <span id="yr"></span> Your Name. All rights reserved.</span>
    <a href="#top">Back to top</a>
  </div>
</footer>

<dialog id="player" aria-label="Video player">
  <button class="close" id="closeBtn" type="button" aria-label="Close video">&times;</button>
  <div class="frame" id="frame"></div>
</dialog>

<script>
  /* ====== EDIT YOUR DETAILS HERE ====== */
  const MY_EMAIL = "you@example.com";
  const SHOWREEL_ID = "YOUR_SHOWREEL_ID";

  // YouTube link: youtube.com/watch?v=ABC123  ->  id = "ABC123"
  // cat can be any category name; filter buttons are created automatically.
  const videos = [
    { id: "YOUR_VIDEO_ID_1", title: "Project title 1", desc: "Logo animation", cat: "Motion graphics" },
    { id: "YOUR_VIDEO_ID_2", title: "Project title 2", desc: "Explainer video", cat: "Motion graphics" },
    { id: "YOUR_VIDEO_ID_3", title: "Project title 3", desc: "Full YouTube edit", cat: "YouTube" },
    { id: "YOUR_VIDEO_ID_4", title: "Project title 4", desc: "Vlog edit", cat: "YouTube" },
    { id: "YOUR_VIDEO_ID_5", title: "Project title 5", desc: "Captions and fast cuts", cat: "Reels and Shorts" },
    { id: "YOUR_VIDEO_ID_6", title: "Project title 6", desc: "Product reel", cat: "Reels and Shorts" }
  ];
  /* ===================================== */

  const thumb = id => `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
  const dlg = document.getElementById("player");
  const frame = document.getElementById("frame");
  let lastFocus = null;

  function openVideo(id, title, trigger) {
    lastFocus = trigger;
    frame.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" title="${title}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    dlg.showModal();
  }
  dlg.addEventListener("close", () => { frame.innerHTML = ""; if (lastFocus) lastFocus.focus(); });
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  document.getElementById("closeBtn").addEventListener("click", () => dlg.close());

  // Showreel
  const reelBtn = document.getElementById("reelBtn");
  const reelImg = document.getElementById("reelImg");
  reelImg.src = thumb(SHOWREEL_ID);
  reelImg.onerror = () => reelImg.remove();
  reelBtn.addEventListener("click", () => openVideo(SHOWREEL_ID, "Showreel", reelBtn));

  // Work grid and filters
  const grid = document.getElementById("videos");
  const filtersEl = document.getElementById("filters");
  const cats = ["All", ...new Set(videos.map(v => v.cat))];
  let active = "All";

  function renderFilters() {
    filtersEl.innerHTML = "";
    cats.forEach(c => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c;
      b.setAttribute("aria-pressed", c === active);
      b.addEventListener("click", () => { active = c; renderFilters(); renderGrid(); });
      filtersEl.appendChild(b);
    });
  }
  function renderGrid() {
    grid.innerHTML = "";
    const list = videos.filter(v => active === "All" || v.cat === active);
    if (!list.length) { grid.innerHTML = '<p class="empty">No projects in this category yet.</p>'; return; }
    list.forEach(v => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "card";
      el.setAttribute("aria-label", "Play video: " + v.title);
      el.innerHTML = `
        <div class="thumb">
          <img src="${thumb(v.id)}" alt="" loading="lazy" onerror="this.remove()">
          <span class="play"></span>
        </div>
        <h3>${v.title}</h3>
        <p>${v.desc}</p>`;
      el.addEventListener("click", () => openVideo(v.id, v.title, el));
      grid.appendChild(el);
    });
  }
  renderFilters();
  renderGrid();

  // Portrait placeholder: first letter of your name
  document.getElementById("photo").textContent = document.querySelector(".logo").textContent.trim().charAt(0).toUpperCase();

  // Contact form: free option, opens the visitor's email app with the message filled in
  document.getElementById("contactForm").addEventListener("submit", e => {
    e.preventDefault();
    const n = document.getElementById("n").value;
    const t = document.getElementById("t").value;
    const m = document.getElementById("m").value;
    const body = `Name: ${n}\nProject type: ${t}\n\n${m}`;
    location.href = `mailto:${MY_EMAIL}?subject=${encodeURIComponent("Portfolio enquiry: " + t)}&body=${encodeURIComponent(body)}`;
  });

  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
